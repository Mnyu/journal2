services:
  n8n:
    ports:
      - '5678:5678'
    volumes:
      # - n8n_data:/home/node/.n8n
      - ./n8n/data/n8n_data:/home/node/.n8n
  app:
    build:
      context: .
    image: app:1.0.0
    ports:
      - '3000:3000'
    env_file:
      - .env.docker.dev
  migrate:
    build:
      context: .
      target: migrate
    image: app-migrate:1.0.0
    env_file:
      - .env.docker.dev
  db:
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
  caddy:
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    depends_on:
      - app
volumes:
  postgres_data:
  # n8n_data:
